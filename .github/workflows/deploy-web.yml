# Release trigger: deploy GP Work API and Web from one commit.
name: Deploy Web

on:
  push:
    branches: [main, 'codex/worker-day-cycle-v2']
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'deploy/docker-compose.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-api.yml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-gp-work-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[deploy gp-work]')
    name: Build and deploy web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for verified release CI
        uses: actions/github-script@v7
        timeout-minutes: 20
        with:
          script: |
            for (let attempt = 0; attempt < 120; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: context.sha,
                per_page: 10,
              });
              const run = data.workflow_runs.find(run => run.head_sha === context.sha);
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error('ci.yml failed for ' + context.sha + ': ' + run.conclusion);
                }
                core.info('Verified successful ci.yml for ' + context.sha);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Timed out waiting for ci.yml at ' + context.sha);

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build frontend
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          cat > apps/web/.env.production <<EOF
          VITE_API_URL=/api
          VITE_APP_URL=${FRONTEND_URL}
          VITE_NURSERY_NAME=GP Work
          EOF
          npm run build -w @gp-work/web
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > apps/web/dist/version.json
          tar -czf web-dist.tar.gz -C apps/web/dist .

      - name: Wait for matching API deployment
        uses: actions/github-script@v7
        timeout-minutes: 20
        with:
          script: |
            for (let attempt = 0; attempt < 120; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'deploy-api.yml',
                head_sha: context.sha,
                per_page: 10,
              });
              const run = data.workflow_runs.find(run => run.head_sha === context.sha);
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error('deploy-api.yml failed for ' + context.sha + ': ' + run.conclusion);
                }
                core.info('Verified successful deploy-api.yml for ' + context.sha);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Timed out waiting for deploy-api.yml at ' + context.sha);

      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: web-dist.tar.gz
          target: /tmp/

      - name: Extract static files
        id: extract
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            backup_dir="/opt/gp-work/backups"
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p "$backup_dir"
            chmod 700 "$backup_dir"
            if [ -d /opt/gp-work/web ] && [ "$(find /opt/gp-work/web -mindepth 1 -print -quit)" ]; then
              web_backup="$backup_dir/web-${stamp}.tar.gz"
              tar -czf "$web_backup" -C /opt/gp-work/web .
              printf '%s\n' "$web_backup" > /opt/gp-work/.last-web-backup
            fi
            mkdir -p /opt/gp-work/web
            rm -rf /opt/gp-work/web/*
            tar -xzf /tmp/web-dist.tar.gz -C /opt/gp-work/web
            rm -f /tmp/web-dist.tar.gz
            chmod -R a+rX /opt/gp-work/web
            test -s /opt/gp-work/web/index.html
            find "$backup_dir" -type f -mtime +14 -delete

      - name: Smoke test production web
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${FRONTEND_URL}/" >/dev/null
          curl --retry 5 --retry-delay 2 --fail --silent --show-error "${FRONTEND_URL}/version.json?release=${GITHUB_SHA}" |
            node -e 'let body=""; process.stdin.on("data", c => body += c).on("end", () => { const version=JSON.parse(body); if (version.commit !== process.env.GITHUB_SHA) process.exit(1); console.log("Verified web commit: " + version.commit); });'

      - name: Roll back web after failed smoke test
        if: failure() && (steps.extract.outcome == 'success' || steps.extract.outcome == 'failure')
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            if [ -s /opt/gp-work/.last-web-backup ]; then
              web_backup="$(cat /opt/gp-work/.last-web-backup)"
              test -s "$web_backup"
              rm -rf /opt/gp-work/web/*
              tar -xzf "$web_backup" -C /opt/gp-work/web
              chmod -R a+rX /opt/gp-work/web
            fi
