# Серверде: /etc/nginx/conf.d/gp-work.gpartners.kz.conf
# sudo nginx -t && sudo systemctl reload nginx
# SSL: sudo certbot --nginx -d gp-work.gpartners.kz

server {    
    server_name gp-work.gpartners.kz;
    root /opt/gp-work/web;
    
    client_max_body_size 100m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # GP Work entry revalidation: begin
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }
    location = /version.json {
        expires -1;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        expires -1;
        try_files $uri =404;
    }
    # GP Work entry revalidation: end
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        expires off;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
